<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Card Shape similar to an App Icon -->
  <rect width="512" height="512" rx="120" fill="url(#logo-grad)" />
  
  <!-- Interactive-feeling inner overlay -->
  <circle cx="256" cy="256" r="220" fill="white" fill-opacity="0.04" />
  
  <!-- Beautiful elegant SVG Monogram -->
  <g transform="translate(96, 96) scale(13.333)" filter="url(#shadow)">
    <!-- Circumference Circle -->
    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.8" stroke-opacity="0.45" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Wave lines -->
    <path d="M12 5V19M6 9C8 9 9.5 12 12 12C14.5 12 16 9 18 9M6 15C8 15 9.5 12 12 12C14.5 12 16 15 18 15" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
