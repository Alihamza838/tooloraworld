<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="fav-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="fav-inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="fav-t-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EA580C" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Vibrant Gradient Border -->
  <rect width="512" height="512" rx="128" fill="url(#fav-bg-grad)" filter="url(#fav-glow)" />

  <!-- Inner High-Contrast Navy Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#fav-inner-grad)" />

  <!-- Dashed Orbital Security Ring -->
  <circle cx="256" cy="256" r="160" stroke="#FB923C" stroke-width="14" stroke-dasharray="24 20" stroke-opacity="0.75" />

  <!-- Geometric Modern Monogram 'T' -->
  <g id="monogram">
    <!-- Top Horizontal Crossbar -->
    <rect x="130" y="145" width="252" height="64" rx="20" fill="url(#fav-t-grad)" />
    
    <!-- Vertical Core Stem -->
    <rect x="224" y="195" width="64" height="180" rx="24" fill="url(#fav-t-grad)" />

    <!-- Center Accent Dot -->
    <circle cx="256" cy="177" r="18" fill="#EA580C" />

    <!-- Energy Spark Accent -->
    <path d="M330 250 L285 315 H325 L295 385" stroke="#F97316" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
